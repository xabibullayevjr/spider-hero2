<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spider Hero</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b1020;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
</style></head><body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H,S,VW;
function rs(){W=c.width=c.clientWidth;H=c.height=c.clientHeight;S=H/500;VW=W/S}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem('sh_best')||0}catch(e){}
const SK=[{n:'Klassik',p:0,k:'classic',a:'#d62839',b:'#1d4ed8'},{n:'Temir Qalqon',p:50,k:'armor',a:'#cbd5e1',b:'#dc2626'},{n:'Chaqmoq Ovchi',p:100,k:'bolt',a:'#facc15',b:'#7c3aed'},{n:'Yashil Gigant',p:150,k:'giant',a:'#22c55e',b:'#15803d'},{n:'Qora Mushuk',p:200,k:'cat',a:'#1f2937',b:'#0f172a'},{n:'Olov Ruhi',p:300,k:'flame',a:'#f97316',b:'#b91c1c'}];
let total=0,owned=[0],sel=0,ui=[],msg='',msgT=0;
try{total=+localStorage.getItem('sh_coins')||0;owned=JSON.parse(localStorage.getItem('sh_owned')||'[0]');sel=+localStorage.getItem('sh_skin')||0}catch(e){}
function sv(){try{localStorage.setItem('sh_coins',total);localStorage.setItem('sh_owned',JSON.stringify(owned));localStorage.setItem('sh_skin',sel)}catch(e){}}
let lastSt='menu',st='menu',p,v,att,L,hooks,coins,genX,hz,pw,parts,mag,shield,combo,comboT,shake,cam,score,cn,t=0,hold=false;
function reset(){p={x:0,y:200};v={x:6,y:0};att=null;hooks=[];coins=[];hz=[];pw=[];parts=[];mag=0;shield=false;combo=0;comboT=0;shake=0;genX=0;cam=-VW*.3;score=0;cn=0;gen()}
function gen(){while(genX<cam+VW+700){const d=Math.min(1,genX/12000);genX+=170+Math.random()*(120+d*80);hooks.push({x:genX,y:60+Math.random()*130});
 const bx=genX+70,by=170+Math.random()*180;
 if(Math.random()<.6){const n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)coins.push({x:bx-40+i*28,y:by-Math.sin(i/(n-1)*Math.PI)*45})}
 if(genX>1500&&Math.random()<.35+d*.25)hz.push({x:genX+60+Math.random()*60,y:200+Math.random()*200,r:14,ph:Math.random()*6});
 if(Math.random()<.08)pw.push({x:genX+90,y:150+Math.random()*180,k:Math.random()<.5?'m':'s'})}}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=1+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:30+Math.random()*20,m:50,c})}}
function tickParts(k){for(let i=parts.length-1;i>=0;i--){const a=parts[i];a.x+=a.vx*k;a.y+=a.vy*k;a.vy+=.15*k;a.life-=k;if(a.life<=0)parts.splice(i,1)}}
function press(){
 if(st!=='play'){return}
 let b=null,bd=1e9;
 for(const h of hooks){if(h.x<p.x-20)continue;const d=Math.hypot(h.x-p.x,h.y-p.y);if(d<380&&h.y<p.y-30&&d<bd){bd=d;b=h}}
 if(b){att=b;L=bd}
}
function rel(){if(att){att=null;v.x*=1.08;v.y-=1.5}}
let overAt=0;
function start(){if(st==='menu'||performance.now()-overAt>500){reset();st='play'}}
addEventListener('pointerdown',e=>{e.preventDefault();if(st==='play'){hold=true;press();return}
 const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/S,y=(e.clientY-r.top)/S;
 for(const b of ui)if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.f();return}});
addEventListener('pointerup',()=>{if(st==='play'){hold=false;rel()}});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();if(st==='play'){hold=true;press()}else if(st!=='shop')start()}});
addEventListener('keyup',e=>{if(e.code==='Space'){hold=false;rel()}});
function die(){st='over';overAt=performance.now();att=null;if(score>best){best=score;try{localStorage.setItem('sh_best',best)}catch(e){}}}
function update(k){
 v.y+=.45*k;
 if(!att&&v.x<3)v.x+=.06*k;
 p.x+=v.x*k;p.y+=v.y*k;
 if(att){const dx=p.x-att.x,dy=p.y-att.y,d=Math.hypot(dx,dy);
  if(d>L){const nx=dx/d,ny=dy/d;p.x=att.x+nx*L;p.y=att.y+ny*L;const vr=v.x*nx+v.y*ny;if(vr>0){v.x-=vr*nx;v.y-=vr*ny}}}
 const sp=Math.hypot(v.x,v.y);const mx=17+Math.min(5,p.x/5000);if(sp>mx){v.x*=mx/sp;v.y*=mx/sp}
 if(p.y<24){p.y=24;if(v.y<0)v.y=0}
 if(p.y>470){if(shield){shield=false;v.y=-15;p.y=468;shake=10;burst(p.x,470,'#22d3ee',20)}else{burst(p.x,470,'#ffd23f',24);shake=10;die()}}
 t+=k;if(mag>0)mag-=k;comboT-=k;if(comboT<=0)combo=0;
 if(t%3<k)parts.push({x:p.x,y:p.y,vx:-v.x*.1,vy:0,life:16,m:16,c:SK[sel].a});
 for(let i=coins.length-1;i>=0;i--){const q=coins[i];let d=Math.hypot(q.x-p.x,q.y-p.y);
  if(mag>0&&d<190&&d>1){q.x+=(p.x-q.x)/d*10*k;q.y+=(p.y-q.y)/d*10*k;d=Math.hypot(q.x-p.x,q.y-p.y)}
  if(d<30){coins.splice(i,1);combo++;comboT=75;const val=1+Math.floor(combo/5);cn+=val;total+=val;sv();burst(q.x,q.y,'#ffd23f',5)}}
 for(let i=hz.length-1;i>=0;i--){const h=hz[i];if(Math.hypot(h.x-p.x,h.y-p.y)<h.r+12){hz.splice(i,1);burst(h.x,h.y,'#ef4444',24);shake=14;if(shield)shield=false;else{burst(p.x,p.y,'#fff',30);die();return}}}
 for(let i=pw.length-1;i>=0;i--){const q=pw[i];if(Math.hypot(q.x-p.x,q.y-p.y)<32){pw.splice(i,1);if(q.k==='m')mag=360;else shield=true;burst(q.x,q.y,'#22d3ee',16)}}
 tickParts(k);
 while(hooks.length&&hooks[0].x<cam-100)hooks.shift();
 while(coins.length&&coins[0].x<cam-100)coins.shift();while(hz.length&&hz[0].x<cam-100)hz.shift();while(pw.length&&pw[0].x<cam-100)pw.shift();
 cam+=((p.x-VW*.3)-cam)*.12;
 score=Math.floor(p.x/50)+cn*10;
 gen();
}
function hash(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s)}
function ball(k,r){g.save();g.scale(r/15,r/15);const s=SK[k];
 if(s.k==='cat'){g.fillStyle=s.a;for(const m of[-1,1]){g.beginPath();g.moveTo(m*13,-6);g.lineTo(m*12,-21);g.lineTo(m*4,-13);g.fill()}}
 if(s.k==='flame'){for(const m of[-9,0,9]){g.fillStyle=m?'#f97316':'#fde047';g.beginPath();g.moveTo(m-6,-10);g.lineTo(m,m?-24:-28);g.lineTo(m+6,-10);g.fill()}}
 g.fillStyle=s.a;g.beginPath();g.arc(0,0,15,0,7);g.fill();
 g.fillStyle=s.b;g.beginPath();g.arc(0,0,15,.2,Math.PI-.2);g.fill();
 const eyes=()=>{g.fillStyle='#fff';g.beginPath();g.ellipse(5,-3,4,6,.4,0,7);g.ellipse(-3,-3,4,6,-.4,0,7);g.fill()};
 if(s.k==='classic'){g.strokeStyle='#111';g.lineWidth=1;g.beginPath();g.moveTo(-15,0);g.lineTo(15,0);g.moveTo(0,-15);g.lineTo(0,15);g.stroke();eyes()}
 else if(s.k==='armor'){g.fillStyle='#22d3ee';g.fillRect(-10,-6,20,5);g.beginPath();g.arc(0,8,3.5,0,7);g.fill()}
 else if(s.k==='bolt'){eyes();g.fillStyle='#fff';g.beginPath();g.moveTo(3,2);g.lineTo(-4,10);g.lineTo(0,10);g.lineTo(-2,15);g.lineTo(6,6);g.lineTo(2,6);g.fill()}
 else if(s.k==='giant'){g.fillStyle='#fff';g.beginPath();g.arc(-5,-2,3.5,0,7);g.arc(5,-2,3.5,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(-5,-2,1.5,0,7);g.arc(5,-2,1.5,0,7);g.fill();g.strokeStyle='#052e16';g.lineWidth=2.5;g.beginPath();g.moveTo(-10,-8);g.lineTo(-2,-5);g.moveTo(10,-8);g.lineTo(2,-5);g.stroke()}
 else if(s.k==='cat'){g.fillStyle='#a3e635';g.beginPath();g.ellipse(-5,-2,3.5,5,0,0,7);g.ellipse(5,-2,3.5,5,0,0,7);g.fill();g.fillStyle='#111';g.fillRect(-5.8,-6,1.6,8);g.fillRect(4.2,-6,1.6,8)}
 else eyes();
 g.restore()}
function B(l,x,y,w,h,f,col){ui.push({x,y,w,h,f});g.fillStyle=col||'#d62839';g.beginPath();g.roundRect(x,y,w,h,12);g.fill();g.fillStyle='#fff';g.font='bold 20px system-ui';g.textAlign='center';g.fillText(l,x+w/2,y+h/2+7)}
function draw(){ui=[];
 g.setTransform(S,0,0,S,0,0);if(shake>.5)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9;
 const sky=g.createLinearGradient(0,0,0,500);sky.addColorStop(0,'#1b2a6b');sky.addColorStop(1,'#e0705a');
 g.fillStyle=sky;g.fillRect(0,0,VW,500);
 for(let l=0;l<2;l++){const sc=l?.6:.3,w=l?90:130;g.fillStyle=l?'#141a3d':'#1d2552';
  const o=Math.floor(cam*sc/w);
  for(let i=o;i<o+VW/w+3;i++){const h=110+hash(i+l*50)*(l?170:230);g.fillRect(i*w-cam*sc,470-h,w-8,h)}}
 g.fillStyle='#7a1b2b';g.fillRect(0,470,VW,40);
 g.fillStyle='#ff6b6b';for(let i=0;i<VW;i+=40)g.fillRect(i-(cam%40),470,20,4);
 g.save();g.translate(-cam,0);
 for(const h of hooks){g.fillStyle='#fff';g.globalAlpha=.8;g.beginPath();g.arc(h.x,h.y,6,0,7);g.fill();g.globalAlpha=.25;g.beginPath();g.arc(h.x,h.y,12,0,7);g.fill();g.globalAlpha=1}
 for(const q of coins){g.fillStyle='#ffd23f';g.beginPath();g.arc(q.x,q.y,9,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=2;g.stroke()}
 for(const h of hz){g.save();g.translate(h.x,h.y);g.rotate(performance.now()/600+h.ph);g.fillStyle='#ef4444';for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(-5,-h.r+2);g.lineTo(0,-h.r-9);g.lineTo(5,-h.r+2);g.fill()}g.beginPath();g.arc(0,0,h.r,0,7);g.fill();g.fillStyle='#450a0a';g.beginPath();g.arc(0,0,6,0,7);g.fill();g.restore()}
 for(const q of pw){const pu=1+Math.sin(performance.now()/200)*.12;g.save();g.translate(q.x,q.y);g.scale(pu,pu);g.fillStyle=q.k==='m'?'#22d3ee':'#a3e635';g.beginPath();g.arc(0,0,13,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.fillStyle='#0b1020';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(q.k==='m'?'M':'Q',0,5);g.restore()}
 for(const a of parts){g.globalAlpha=Math.max(0,a.life/a.m);g.fillStyle=a.c;g.fillRect(a.x-2,a.y-2,4,4)}g.globalAlpha=1;
 if(att){g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.moveTo(p.x,p.y-4);g.lineTo(att.x,att.y);g.stroke()}
 g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(v.y,v.x)*.5);
 ball(sel,15);
 g.restore();
 if(shield){g.strokeStyle='rgba(34,211,238,.9)';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,25,0,7);g.stroke()}
 if(mag>0){g.strokeStyle='rgba(255,210,63,.35)';g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,190,0,7);g.stroke()}
 g.restore();
 g.fillStyle='#fff';g.font='bold 22px system-ui';g.textAlign='left';g.fillText('Ochko: '+score,16,34);
 g.font='15px system-ui';g.fillText('Rekord: '+best+'   Tanga: '+cn,16,56);
 if(st==='play'){if(combo>1){g.fillStyle='#ffd23f';g.font='bold 26px system-ui';g.fillText('KOMBO x'+combo,16,90)}
  if(mag>0){g.fillStyle='#22d3ee';g.font='bold 13px system-ui';g.fillText('MAGNIT',16,112);g.fillRect(70,103,mag/360*80,8)}
  if(shield){g.fillStyle='#a3e635';g.font='bold 13px system-ui';g.fillText('QALQON \u2713',16,132)}}
 if(st!=='play'){g.fillStyle='rgba(5,8,25,.7)';g.fillRect(0,0,VW,500);g.textAlign='center';g.fillStyle='#fff';
  const bw=Math.min(230,VW-30),cx=VW/2-bw/2;
  if(st==='shop'){
   g.font='bold 30px system-ui';g.fillText('DO\u02BBKON',VW/2,40);g.font='bold 17px system-ui';g.fillStyle='#ffd23f';g.fillText('Tangalar: '+total,VW/2,66);
   const cols=Math.max(1,Math.min(3,Math.floor((VW-20)/200))),rows=Math.ceil(SK.length/cols),ch=Math.min(100,356/rows)-8,cw=(VW-20-(cols-1)*10)/cols;
   SK.forEach((k,i)=>{const x=10+(i%cols)*(cw+10),y=84+Math.floor(i/cols)*(ch+8),o=owned.includes(i);
    g.fillStyle=i===sel?'rgba(255,210,63,.25)':'rgba(255,255,255,.1)';g.beginPath();g.roundRect(x,y,cw,ch,12);g.fill();
    if(i===sel){g.strokeStyle='#ffd23f';g.lineWidth=2;g.stroke()}
    ui.push({x,y,w:cw,h:ch,f(){if(o)sel=i;else if(total>=k.p){total-=k.p;owned.push(i);sel=i;msg='Sotib olindi!'}else msg='Tanga yetarli emas';msgT=performance.now()+1300;sv()}});
    const r=Math.min(24,ch/2-8);g.save();g.translate(x+r+14,y+ch/2);ball(i,r);g.restore();
    g.textAlign='left';g.fillStyle='#fff';g.font='bold 15px system-ui';g.fillText(k.n,x+r*2+28,y+ch/2-2);
    g.font='14px system-ui';g.fillStyle=i===sel?'#ffd23f':o?'#9ae6b4':'#ffd23f';g.fillText(i===sel?'Tanlangan \u2713':o?'Tanlash':'\u25CF '+k.p+' tanga',x+r*2+28,y+ch/2+18)});
   g.textAlign='center';if(performance.now()<msgT){g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText(msg,VW/2,500-62)}
   B('Orqaga',cx,500-52,bw,42,()=>{st=lastSt},'#334155')
  }else{
   g.font='bold 54px system-ui';g.fillText(st==='menu'?'SPIDER HERO':'O\u02BByin tugadi',VW/2,150);
   g.font='22px system-ui';
   if(st==='over')g.fillText('Ochko: '+score+'   Rekord: '+best,VW/2,195);
   g.fillStyle='#ffd23f';g.font='bold 18px system-ui';g.fillText('Tangalar: '+total,VW/2,230);
   B(st==='menu'?'O\u02BByinni boshlash':'Qayta o\u02BBynash',cx,260,bw,54,start);
   B('Do\u02BBkon',cx,328,bw,54,()=>{lastSt=st;st='shop'},'#7c3aed');
   g.fillStyle='#fff';g.font='15px system-ui';g.fillText('Ushlab turing \u2014 ip otiladi, qo\u02BByib yuboring \u2014 uchasiz',VW/2,420);g.fillStyle='#ffd23f';g.font='14px system-ui';g.fillText('Tikanlardan qoching \u2022 Magnit (M) va Qalqon (Q) oling \u2022 Kombo yig\u02BBing!',VW/2,448)}}
}
let last=performance.now();
function loop(n){const k=Math.min((n-last)/16.67,2.5);last=n;if(st==='play')update(k);else tickParts(k);draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
